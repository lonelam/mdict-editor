name: build

# 3-platform client builds (Windows / macOS Apple Silicon / macOS Intel / Linux).
# - push a `v*` tag → builds all platforms and publishes a GitHub Release
#   with the installers (NSIS/MSI, DMG x2, AppImage/deb)
# - manual dispatch → artifacts on the workflow run
#
# mdictlib comes from crates.io; no sibling checkout is needed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon build
          - platform: macos-latest
            args: ""
          # Native Intel macOS build (bypasses audiopus_sys cross-compile bug)
          # CRITICAL FIX: macos-13 is retired. macos-15-intel is the official x86_64 runner.
          - platform: macos-15-intel
            args: ""
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # mdictlib's "lzo" feature needs liblzo + pkg-config. 
      # (autoconf/automake/libtool are pre-installed by GitHub)
      - name: Install macOS dependencies
        if: startsWith(matrix.platform, 'macos')
        run: |
          brew install lzo pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix lzo)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies (Tauri v2)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build app
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: mdict-editor-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/msi/*.msi
            src-tauri/target/**/bundle/nsis/*.exe
            src-tauri/target/**/bundle/appimage/*.AppImage
            src-tauri/target/**/bundle/deb/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect installers
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-files

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/**
          generate_release_notes: true
